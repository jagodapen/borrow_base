# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  activerecord:
    errors:
      models:
        borrowing:
          attributes:
            base:
              already_returned: "Borrowing is already returned"
            borrow_date:
              in_future: "cannot be in the future"
            user:
              immutable: "cannot be changed"
            item:
              already_borrowed: "is already borrowed"
              immutable: "cannot be changed"
  borrowing_mailer:
    return_reminder:
      subject:
        zero: "Reminder: \"%{title}\" is due today"
        one: "Reminder: \"%{title}\" is due tomorrow"
        other: "Reminder: \"%{title}\" is due in %{count} days"
      greeting: "Hello %{name},"
      body:
        zero: "The return period for \"%{title}\" ends today (%{due_date}). Please return it today."
        one: "The return period for \"%{title}\" ends tomorrow (%{due_date}). Please return it on time."
        other: "The return period for \"%{title}\" ends in %{count} days (%{due_date}). Please return it on time."
      closing: "Thank you, BorrowBase"
